name: Go validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
      - name: Install the PDF adapter dependency
        run: python -m pip install -r adapters/pdf/requirements.txt
      - name: Python adapter tests with synthetic PDFs
        run: python -m unittest discover -s adapters/pdf -p 'test_*.py' -v
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Static analysis
        run: go vet ./...
      - name: Staticcheck
        run: make staticcheck
      - name: Vulnerability check
        run: make vulncheck
      - name: Tests with race detection
        run: go test -race -count=1 ./...
      - name: Validate synthetic catalog
        run: go run ./cmd/alexandria catalog validate testdata/catalog/valid.json
